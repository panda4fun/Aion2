name: boss-notifier

on:
  schedule:
    - cron: "*/5 * * * *"     # раз в 5 минут (GitHub может задерживать запуск)
  workflow_dispatch:           # кнопка ручного запуска и перезапуск самого себя

# Каждый запуск в конце запускает следующий, cron нужен как страховка, если цепочка оборвётся.
# Лишние запуски в очереди GitHub отменяет сам: ждать может только один.
concurrency:
  group: boss-notifier
  cancel-in-progress: false

permissions:
  contents: read
  actions: write               # чтобы запустить следующий запуск

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: boss-state-${{ github.run_id }}
          restore-keys: boss-state-

      - name: Run notifier
        run: python boss_notifier.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MAPS: ${{ vars.MAPS }}
          ONLY: ${{ vars.ONLY }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: boss-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start next run
        # при ручной отмене запуска цепочка останавливается
        if: (success() || failure()) && github.ref == 'refs/heads/main'
        run: gh workflow run boss.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
